<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="24" height="24"><svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="24" height="24"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="favicon-bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#635BFF"></stop>
      <stop offset="50%" stop-color="#7C6FFF"></stop>
      <stop offset="100%" stop-color="#2FE4AB"></stop>
    </linearGradient>
    <radialGradient id="favicon-glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"></stop>
      <stop offset="100%" stop-color="white" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="favicon-shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.5"></feGaussianBlur>
      <feOffset dx="0" dy="1" result="offsetblur"></feOffset>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"></feFuncA>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="24" height="24" rx="5.5" fill="url(#favicon-bg-gradient)"></rect>
  
  <!-- Inner glow -->
  <rect width="24" height="24" rx="5.5" fill="url(#favicon-glow)"></rect>
  
  <!-- Bolt icon -->
  <g filter="url(#favicon-shadow)">
    <path d="M13 2 L4 13 L10.5 13 L8 22 L20 9 L13.5 9 Z" fill="white" opacity="0.95"></path>
  </g>
  
  <!-- Pulse ring -->
  <path d="M12 6 C8.69 6 6 8.69 6 12 C6 15.31 8.69 18 12 18" stroke="white" stroke-width="1.5" fill="none" opacity="0.15" stroke-dasharray="2 3"></path>
</svg></svg><style>@media (prefers-color-scheme: light) { :root { filter: none; } }
@media (prefers-color-scheme: dark) { :root { filter: none; } }
</style></svg>